openapi: 3.0.3

info:
  title: Store Management API
  description: JWT authentication and Store management API built with Laravel 11.
  version: 1.0.0

servers:
  - url: http://localhost:8000/api
    description: Local Development

tags:
  - name: Authentication
    description: JWT authentication endpoints
  - name: Store
    description: Store management endpoints

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: superadmin@example.com
        password:
          type: string
          format: password
          example: password

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
          example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 3600

    User:
      type: object
      properties:
        id:
          type: string
          example: 01keg02s5m0p2vx8baj8c4bsn6
        store_id:
          type: string
          nullable: true
          example: null
        role_id:
          type: string
          example: 01keg02ry7eve4xkvxm9excd4c
        first_name:
          type: string
          example: Super
        last_name:
          type: string
          example: Admin
        email:
          type: string
          format: email
          example: superadmin@example.com
        phone_number:
          type: string
          nullable: true
          example: "+2916061428"
        photo_profile:
          type: string
          nullable: true
          example: null
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Store:
      type: object
      properties:
        id:
          type: string
          example: 01keg02s5m0p2vx8baj8c4bsn6
        parent_id:
          type: string
          nullable: true
          example: null
        name:
          type: string
          example: Central Store
        level:
          type: string
          enum: [center, branch, retail]
          example: center
        address:
          type: string
          nullable: true
          example: 123 Main St
        phone:
          type: string
          nullable: true
          example: "08123456789"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        parent:
          $ref: '#/components/schemas/Store'
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'

    StoreListResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            current_page:
              type: integer
            last_page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
            data:
              type: array
              items:
                $ref: '#/components/schemas/Store'

    MessageResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string

paths:
  /login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticate user and return JWT token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Validation error
        '401':
          description: Invalid credentials

  /me:
    get:
      tags:
        - Authentication
      summary: Get authenticated user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Authenticated user data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthenticated

  /logout:
    post:
      tags:
        - Authentication
      summary: Logout user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthenticated

  /stores:
    get:
      tags:
        - Store
      summary: List stores
      description: Get a paginated list of stores with optional search by name.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Search term for store name
        - in: query
          name: per_page
          schema:
            type: integer
          description: Number of stores per page (default 10)
      responses:
        '200':
          description: List of stores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreListResponse'

    post:
      tags:
        - Store
      summary: Create a new store
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, level]
              properties:
                parent_id:
                  type: string
                  nullable: true
                  example: null
                name:
                  type: string
                  example: Central Store
                level:
                  type: string
                  enum: [center, branch, retail]
                  example: center
                address:
                  type: string
                  nullable: true
                  example: 123 Main St
                phone:
                  type: string
                  nullable: true
                  example: "08123456789"
      responses:
        '201':
          description: Store created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
        '403':
          description: Forbidden
        '422':
          description: Validation error

  /stores/{storeId}:
    get:
      tags:
        - Store
      summary: Get store detail
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: storeId
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Store detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'

    put:
      tags:
        - Store
      summary: Update store
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: storeId
          schema:
            type: string
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                parent_id:
                  type: string
                  nullable: true
                name:
                  type: string
                level:
                  type: string
                  enum: [center, branch, retail]
                address:
                  type: string
                  nullable: true
                phone:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Store updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
        '403':
          description: Forbidden
        '422':
          description: Validation error

    delete:
      tags:
        - Store
      summary: Delete store
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: storeId
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Store deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '403':
          description: Forbidden
