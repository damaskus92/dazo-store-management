openapi: 3.0.3

info:
  title: Store Management API
  description: JWT authentication, Store, User, Cashier, and Product management API built with Laravel 11.
  version: 1.0.0

servers:
  - url: http://localhost:8000/api
    description: Local Development

tags:
  - name: Authentication
    description: JWT authentication endpoints
  - name: Store
    description: Store management endpoints
  - name: User
    description: User management endpoints
  - name: Cashier
    description: Cashier management endpoints
  - name: Product
    description: Product management endpoints (admin only)

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: superadmin@example.com
        password:
          type: string
          format: password
          example: password

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
          example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 3600

    User:
      type: object
      properties:
        id:
          type: string
          example: 01keg02s5m0p2vx8baj8c4bsn6
        store_id:
          type: string
          nullable: true
          example: null
        role_id:
          type: string
          example: 01keg02ry7eve4xkvxm9excd4c
        first_name:
          type: string
          example: Super
        last_name:
          type: string
          example: Admin
        email:
          type: string
          format: email
          example: superadmin@example.com
        phone_number:
          type: string
          nullable: true
          example: "+2916061428"
        photo_profile:
          type: string
          nullable: true
          example: null
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        role:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
        store:
          $ref: '#/components/schemas/Store'

    Store:
      type: object
      properties:
        id:
          type: string
          example: 01keg02s5m0p2vx8baj8c4bsn6
        parent_id:
          type: string
          nullable: true
          example: null
        name:
          type: string
          example: Central Store
        level:
          type: string
          enum: [center, branch, retail]
          example: center
        address:
          type: string
          nullable: true
          example: 123 Main St
        phone:
          type: string
          nullable: true
          example: "08123456789"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        parent:
          $ref: '#/components/schemas/Store'
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'

    Product:
      type: object
      properties:
        id:
          type: string
          example: 01keg1234567890abcdef1234
        store_id:
          type: string
          example: 01keg02s5m0p2vx8baj8c4bsn6
        name:
          type: string
          example: Mineral Water 600ml
        sku:
          type: string
          nullable: true
          example: MIN-600
        price:
          type: number
          format: float
          example: 5000
        description:
          type: string
          nullable: true
          example: Bottled mineral water 600ml
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    StoreListResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            current_page:
              type: integer
            last_page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
            data:
              type: array
              items:
                $ref: '#/components/schemas/Store'

    UserListResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            current_page:
              type: integer
            last_page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
            data:
              type: array
              items:
                $ref: '#/components/schemas/User'

    ProductListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            current_page:
              type: integer
            last_page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
            data:
              type: array
              items:
                $ref: '#/components/schemas/Product'

    MessageResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string

    CashierListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            current_page:
              type: integer
            last_page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
            data:
              type: array
              items:
                $ref: '#/components/schemas/User'

paths:
  # Authentication endpoints
  /login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticate user and return JWT token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Validation error
        '401':
          description: Invalid credentials

  /me:
    get:
      tags:
        - Authentication
      summary: Get authenticated user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Authenticated user data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthenticated

  /logout:
    post:
      tags:
        - Authentication
      summary: Logout user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthenticated

  # Store endpoints
  /stores:
    get:
      tags:
        - Store
      summary: List stores
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: per_page
          schema:
            type: integer
      responses:
        '200':
          description: List of stores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreListResponse'

    post:
      tags:
        - Store
      summary: Create a new store
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, level]
              properties:
                parent_id:
                  type: string
                  nullable: true
                name:
                  type: string
                level:
                  type: string
                  enum: [center, branch, retail]
                address:
                  type: string
                  nullable: true
                phone:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Store created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
        '403':
          description: Forbidden
        '422':
          description: Validation error

  /stores/{storeId}:
    get:
      tags:
        - Store
      summary: Get store detail
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: storeId
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Store detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'

    put:
      tags:
        - Store
      summary: Update store
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: storeId
          schema:
            type: string
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                parent_id:
                  type: string
                  nullable: true
                name:
                  type: string
                level:
                  type: string
                  enum: [center, branch, retail]
                address:
                  type: string
                  nullable: true
                phone:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Store updated
        '403':
          description: Forbidden
        '422':
          description: Validation error

    delete:
      tags:
        - Store
      summary: Delete store
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: storeId
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Store deleted
        '403':
          description: Forbidden

  # User endpoints
  /users:
    get:
      tags:
        - User
      summary: List users
      description: Paginated list of users with optional search
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: per_page
          schema:
            type: integer
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'

    post:
      tags:
        - User
      summary: Create a new user
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_id, first_name, last_name, email, password, password_confirmation]
              properties:
                store_id:
                  type: string
                  nullable: true
                role_id:
                  type: string
                first_name:
                  type: string
                last_name:
                  type: string
                email:
                  type: string
                  format: email
                phone_number:
                  type: string
                  nullable: true
                password:
                  type: string
                  format: password
                password_confirmation:
                  type: string
                  format: password
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          description: Forbidden
        '422':
          description: Validation error

  /users/{userId}:
    get:
      tags:
        - User
      summary: Get user detail
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: userId
          schema:
            type: string
          required: true
      responses:
        '200':
          description: User detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

    put:
      tags:
        - User
      summary: Update user
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: userId
          schema:
            type: string
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_id, first_name, last_name, email]
              properties:
                store_id:
                  type: string
                  nullable: true
                role_id:
                  type: string
                first_name:
                  type: string
                last_name:
                  type: string
                email:
                  type: string
                phone_number:
                  type: string
                  nullable: true
                password:
                  type: string
                  format: password
                password_confirmation:
                  type: string
                  format: password
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          description: Forbidden
        '422':
          description: Validation error

    delete:
      tags:
        - User
      summary: Delete user
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: userId
          schema:
            type: string
          required: true
      responses:
        '200':
          description: User deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '403':
          description: Forbidden

  # Cashier endpoints
  /cashiers:
    get:
      tags:
        - Cashier
      summary: List cashiers in current admin's store
      description: Paginated list of cashiers (role = cashier) in the authenticated admin's store, with optional search.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
            description: Search by first_name, last_name, or email
        - in: query
          name: per_page
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: List of cashiers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashierListResponse'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden (not admin or no store)

    post:
      tags:
        - Cashier
      summary: Create a new cashier
      description: Create a cashier (role = cashier) in the authenticated admin's store.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - first_name
                - last_name
                - email
                - password
                - password_confirmation
              properties:
                first_name:
                  type: string
                  example: John
                last_name:
                  type: string
                  example: Doe
                email:
                  type: string
                  format: email
                  example: cashier@example.com
                phone_number:
                  type: string
                  nullable: true
                  example: "08123456789"
                password:
                  type: string
                  format: password
                  minLength: 6
                password_confirmation:
                  type: string
                  format: password
      responses:
        '201':
          description: Cashier created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/User'
                  message:
                    type: string
                    example: Cashier has been successfully created.
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden (not admin)
        '422':
          description: Validation error

  /cashiers/{cashierId}:
    get:
      tags:
        - Cashier
      summary: Get cashier detail
      description: Get detail of a cashier in the authenticated admin's store.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: cashierId
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Cashier detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden (not own store or not cashier)

    put:
      tags:
        - Cashier
      summary: Update cashier
      description: Update a cashier in the authenticated admin's store (partial update allowed).
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: cashierId
          schema:
            type: string
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                  example: Updated
                last_name:
                  type: string
                email:
                  type: string
                  format: email
                phone_number:
                  type: string
                  nullable: true
                password:
                  type: string
                  format: password
                  minLength: 6
                  nullable: true
                password_confirmation:
                  type: string
                  format: password
                  nullable: true
      responses:
        '200':
          description: Cashier updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/User'
                  message:
                    type: string
                    example: Cashier has been successfully updated.
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden (not own store or not cashier)
        '422':
          description: Validation error

    delete:
      tags:
        - Cashier
      summary: Delete cashier
      description: Delete a cashier in the authenticated admin's store.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: cashierId
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Cashier deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    example: Cashier has been successfully deleted.
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden (not own store or not cashier)

  # Product endpoints
  /products:
    get:
      tags:
        - Product
      summary: List products in the authenticated admin's store
      description: Paginated list of products belonging to the admin's store, with optional search by name or SKU.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
            description: Search by product name or SKU
        - in: query
          name: per_page
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden (not admin or no store assigned)

    post:
      tags:
        - Product
      summary: Create a new product
      description: Create a product in the authenticated admin's store.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - price
              properties:
                name:
                  type: string
                  example: Mineral Water 600ml
                sku:
                  type: string
                  nullable: true
                  example: MIN-600
                price:
                  type: number
                  format: float
                  minimum: 0
                  example: 5000
                description:
                  type: string
                  nullable: true
                  example: Bottled mineral water 600ml
                is_active:
                  type: boolean
                  default: true
                  example: true
      responses:
        '201':
          description: Product created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Product'
                  message:
                    type: string
                    example: Product successfully created.
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden (not admin)
        '422':
          description: Validation error

  /products/{productId}:
    get:
      tags:
        - Product
      summary: Get product detail
      description: Retrieve a single product that belongs to the authenticated admin's store.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: productId
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Product detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Product'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden (product does not belong to your store)
        '404':
          description: Product not found

    put:
      tags:
        - Product
      summary: Update product
      description: Update a product that belongs to the authenticated admin's store (partial update allowed).
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: productId
          schema:
            type: string
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - price
              properties:
                name:
                  type: string
                  example: Mineral Water 600ml Updated
                sku:
                  type: string
                  nullable: true
                  example: MIN-600-UPD
                price:
                  type: number
                  format: float
                  minimum: 0
                  example: 5500
                description:
                  type: string
                  nullable: true
                is_active:
                  type: boolean
                  example: false
      responses:
        '200':
          description: Product updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Product'
                  message:
                    type: string
                    example: Product successfully updated.
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden (product does not belong to your store)
        '422':
          description: Validation error

    delete:
      tags:
        - Product
      summary: Delete product
      description: Delete a product that belongs to the authenticated admin's store.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: productId
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Product deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    example: Product successfully deleted.
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden (product does not belong to your store)
        '404':
          description: Product not found